<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Голоса озвучки на стриме VESSAVY — послушай и выбери свой.">
<title>Голоса озвучки VESSAVY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;500;700&display=swap">
<style>
/* Layout: короткая шапка-«эфир» + сетка карточек-голосов, у каждой своя волна, которая заливается при прослушивании */
:root{
  --bg:#f6f2fb; --surface:#ffffff; --ink:#241b33; --muted:#6c607e; --line:#e3daf0;
  --accent:#9b77d0; --accent-ink:#5e3d96; --wave:#d6c7ec; --on-accent:#ffffff;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15111d; --surface:#1f1929; --ink:#efe8fa; --muted:#a397b6; --line:#2f263d;
  --accent:#b294e2; --accent-ink:#cdb6f2; --wave:#3d3150; --on-accent:#1a1324; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15111d; --surface:#1f1929; --ink:#efe8fa; --muted:#a397b6; --line:#2f263d;
  --accent:#b294e2; --accent-ink:#cdb6f2; --wave:#3d3150; --on-accent:#1a1324; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-block:40px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:32px}
header{display:grid;gap:12px}
.live{display:inline-flex;align-items:center;gap:8px;font:600 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
h1{font:800 clamp(30px,6vw,56px)/1.02 var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance}
h1 span{color:var(--accent)}
.lead{margin:0;max-width:60ch;color:var(--muted)}
.how{display:flex;flex-wrap:wrap;gap:8px 20px;margin:0;padding:0;list-style:none;color:var(--muted);font-size:14px}
.how b{color:var(--ink);font-weight:700}
code{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:.92em;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:14px;min-width:0;transition:border-color .2s}
.card.playing{border-color:var(--accent)}
.top{display:flex;align-items:center;gap:14px;min-width:0}
.play{flex:none;width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.play:hover{transform:scale(1.06)}
.play:focus-visible,.copy:focus-visible{outline:3px solid var(--accent-ink);outline-offset:3px}
.play svg{width:20px;height:20px;fill:currentColor}
.name{font:600 19px/1.15 var(--display);margin:0;overflow-wrap:anywhere}
.dur{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.wave{display:flex;align-items:center;gap:2px;height:44px;cursor:pointer}
.wave span{flex:1;min-width:2px;border-radius:2px;background:var(--wave);transition:background .1s}
.wave span.on{background:var(--accent)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.copy{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font:500 13px var(--body);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.copy:hover{border-color:var(--accent)}
.copy code{border:0;background:none;padding:0}
.phrase{margin:0;font-size:13px;color:var(--muted)}
.empty{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

body{margin:0}
</style>
</head>
<body>
<!-- Шаблон сайта голосов. Его заполняет Streamer.bot (действие «TTS | 13. Сайт голосов»): /*VOICES*/ — список голосов, /*UPDATED*/ — дата. Править можно, метки не трогать. -->

    <ul class="how">
      <li><b>Список в чате:</b> <code>!голоса</code></li>
      <li><b>Выбрать голос:</b> <code>!голос Название</code></li>
    </ul>
  </header>
  <main class="grid" id="grid"></main>
  <p class="phrase" id="phrase"></p>
</div>

const UPDATED="16 октября 2026, 23:35";
const grid=document.getElementById('grid');
const PLAY='<svg viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
const PAUSE='<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4.5" height="14" rx="1.2"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.2"/></svg>';
let current=null;
function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
if(!VOICES.length){grid.innerHTML='<p class="empty">Голоса скоро появятся.</p>'}
VOICES.forEach((v,i)=>{
  const c=document.createElement('article');c.className='card';
  c.innerHTML=`<div class="top"><button class="play" id="play-${i}" aria-label="Прослушать ${v.name}">${PLAY}</button>
    <div style="min-width:0"><h2 class="name"></h2><div class="dur">${fmt(v.dur)}</div></div></div>
    <div class="wave" aria-hidden="true">${v.peaks.map(p=>`<span style="height:${Math.round(p*100)}%"></span>`).join('')}</div>
    <div class="foot"><button class="copy" id="copy-${i}" title="Скопировать команду"><code></code></button></div>`;
  c.querySelector('.name').textContent=v.name;
  const cmd='!голос '+v.name;c.querySelector('.copy code').textContent=cmd;
  const audio=new Audio(v.src);audio.preload='none';
  const btn=c.querySelector('.play'),bars=[...c.querySelectorAll('.wave span')],dur=c.querySelector('.dur');
  const paint=()=>{const k=audio.duration?audio.currentTime/audio.duration:0;bars.forEach((b,j)=>b.classList.toggle('on',j/bars.length<k));dur.textContent=fmt(audio.currentTime||0)+' / '+fmt(audio.duration||v.dur)};
  const stop=()=>{audio.pause();c.classList.remove('playing');btn.innerHTML=PLAY};
  btn.onclick=()=>{
    if(!audio.paused){stop();return}
    if(current&&current!==stop)current();
    current=stop;audio.play();c.classList.add('playing');btn.innerHTML=PAUSE;
  };
  c.querySelector('.wave').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();const k=(e.clientX-r.left)/r.width;const go=()=>{audio.currentTime=k*audio.duration;paint()};if(audio.duration)go();else{audio.addEventListener('loadedmetadata',go,{once:true});audio.load()}if(audio.paused)btn.click()};
  audio.ontimeupdate=paint;audio.onended=()=>{stop();audio.currentTime=0;paint();dur.textContent=fmt(v.dur)};
  const cp=c.querySelector('.copy');
  cp.onclick=async()=>{try{await navigator.clipboard.writeText(cmd);const o=cp.innerHTML;cp.textContent='Скопировано';setTimeout(()=>cp.innerHTML=o,1200)}catch(_){const r=document.createRange();r.selectNodeContents(cp.querySelector('code'));const s=getSelection();s.removeAllRanges();s.addRange(r)}};

});
document.getElementById('phrase').textContent=VOICES.length?'Фраза-пример: «Привет, чат! Это …. Выбери меня, и я буду озвучивать твои сообщения на стриме у Вессави». Обновлено: '+UPDATED+'.':'';
